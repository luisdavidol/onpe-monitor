name: Deploy on merge to main

on:
  push:
    branches:
      - main

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'public/**'
              - 'firebase.json'
            backend:
              - 'server.js'
              - 'package*.json'
              - 'Dockerfile'
              - '.dockerignore'

  deploy_frontend:
    needs: detect_changes
    if: needs.detect_changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONPE_ELECCIONES_2026 }}
          channelId: live
          projectId: onpe-elecciones-2026

  deploy_backend:
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONPE_ELECCIONES_2026 }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy onpe-backend \
            --source . \
            --region=us-central1 \
            --allow-unauthenticated \
            --project=onpe-elecciones-2026 \
            --quiet
